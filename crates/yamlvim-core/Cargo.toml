[package]
name = "yamlvim-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
base64 = "0.22"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "yamlvim-core"
path = "src/bin/yamlvim-core.rs"
